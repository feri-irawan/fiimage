<style>
  /* Terminal: the page opened from a shell prompt, with the title printed
     as output and a cursor waiting below. */
  * {
    font-family: "JetBrains Mono", "Inter", monospace;
    box-sizing: border-box;
    margin: 0;
    color: #e9e6df;
  }

  .canvas {
    width: 600px;
    height: 315px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 30px 38px 30px;
    background: #14161b;
  }

  .command {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .prompt {
    color: #f2b544;
    font-weight: 700;
  }

  .verb {
    color: #8c919c;
  }

  #url {
    color: #8fb3ff;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    max-width: 400px;
  }

  #icon {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    object-fit: cover;
  }

  .output {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    flex: 1;
    overflow: hidden;
  }

  #title {
    display: block;
    font-size: 27px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.6px;
    line-clamp: 3;
  }

  #description {
    display: block;
    color: #8c919c;
    font-size: 14px;
    line-height: 1.5;
    line-clamp: 2;
  }

  .next {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    font-size: 14px;
  }

  .cursor {
    display: flex;
    width: 9px;
    height: 18px;
    background: #f2b544;
  }
</style>

<body>
  <div class="canvas">
    <div class="command">
      <span class="prompt">$</span>
      <span class="verb">open</span>
      <img id="icon" width="18" height="18" src="https://dummyimage.com/150x150/000/fff" />
      <span id="url">https://fiimage.vercel.app</span>
    </div>
    <div class="output">
      <h1 id="title">Lorem ipsum dolor sit amet consectetur adipisicing elit</h1>
      <p id="description">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
    <div class="next">
      <span class="prompt">$</span>
      <div class="cursor"></div>
    </div>
  </div>
</body>
