<style>
  /* Clean: the page's address in small type above a very large title. */
  * {
    font-family: "Instrument Sans", "Inter", sans-serif;
    box-sizing: border-box;
    margin: 0;
    color: #10131a;
  }

  .canvas {
    width: 600px;
    height: 315px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 34px 44px 38px;
    background: #ffffff;
  }

  .address {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  #icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    object-fit: cover;
  }

  .where {
    display: flex;
    font-size: 15px;
    max-width: 480px;
    overflow: hidden;
  }

  #host {
    font-weight: 700;
    white-space: nowrap;
  }

  #path {
    color: #6b7281;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .text {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  #title {
    display: block;
    font-size: 42px;
    font-weight: 700;
    line-height: 1.04;
    letter-spacing: -1.2px;
    line-clamp: 3;
  }

  #description {
    display: block;
    color: #4b5263;
    font-size: 17px;
    line-height: 1.4;
    line-clamp: 2;
  }
</style>

<body>
  <div class="canvas">
    <div class="address">
      <img id="icon" width="22" height="22" src="https://dummyimage.com/150x150/000/fff" />
      <div class="where">
        <span id="host">fiimage.vercel.app</span>
        <span id="path">/og</span>
      </div>
    </div>
    <div class="text">
      <h1 id="title">Lorem ipsum dolor sit amet consectetur adipisicing elit</h1>
      <p id="description">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
  </div>
</body>
