<style>
  * {
    font-family: "Inter", sans-serif;
    box-sizing: border-box;
    margin: 0;
    color: #1f2937;
  }

  .canvas {
    width: 600px;
    height: 315px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.75rem;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
  }

  .card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.8rem;
    width: 100%;
    height: 100%;
    padding: 1.5rem 1.75rem;
    border-radius: 18px;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.25);
  }

  .site {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  #icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    object-fit: cover;
  }

  #url {
    color: #7c3aed;
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    max-width: 440px;
  }

  #title {
    display: block;
    color: #111827;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1.25;
    line-clamp: 3;
  }

  #description {
    display: block;
    color: #6b7280;
    font-size: 0.9rem;
    line-height: 1.4;
    line-clamp: 2;
  }
</style>

<body>
  <div class="canvas">
    <div class="card">
      <!-- No whitespace between these tags: Satori would render it as text. -->
      <div class="site"><img id="icon" width="24" height="24" src="https://dummyimage.com/150x150/000/fff" /><p id="url">https://fiimage.vercel.app</p></div>
      <h1 id="title">Lorem ipsum dolor sit amet consectetur adipisicing elit</h1>
      <p id="description">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Earum
        doloremque accusantium odio.
      </p>
    </div>
  </div>
</body>
