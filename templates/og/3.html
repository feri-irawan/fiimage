<style>
  /* Poster: one flat color and a huge condensed title, like a gig poster. */
  * {
    font-family: "Instrument Sans", "Inter", sans-serif;
    box-sizing: border-box;
    margin: 0;
    color: #1a0d07;
  }

  .canvas {
    width: 600px;
    height: 315px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 26px 36px 30px;
    background: #ff5a2b;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }

  #host {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    max-width: 440px;
  }

  #icon {
    width: 28px;
    height: 28px;
    border-radius: 14px;
    border: 2px solid #1a0d07;
    object-fit: cover;
  }

  .main {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 14px;
    flex: 1;
    overflow: hidden;
  }

  #title {
    display: block;
    font-family: "Instrument Sans Condensed", "Inter", sans-serif;
    font-size: 60px;
    font-weight: 700;
    line-height: 0.92;
    letter-spacing: -1.5px;
    line-clamp: 3;
  }

  #description {
    display: block;
    max-width: 420px;
    font-size: 15px;
    line-height: 1.35;
    line-clamp: 2;
  }
</style>

<body>
  <div class="canvas">
    <div class="top">
      <p id="host">fiimage.vercel.app</p>
      <img id="icon" width="28" height="28" src="https://dummyimage.com/150x150/000/fff" />
    </div>
    <div class="main">
      <h1 id="title">Lorem ipsum dolor sit amet consectetur adipisicing elit</h1>
      <p id="description">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
  </div>
</body>
