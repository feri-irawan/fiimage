<style>
  /* Split: the text on white beside a grey panel with the site's icon and
     host. */
  * {
    font-family: "Instrument Sans", "Inter", sans-serif;
    box-sizing: border-box;
    margin: 0;
    color: #10131a;
  }

  .canvas {
    width: 600px;
    height: 315px;
    overflow: hidden;
    display: flex;
    background: #ffffff;
  }

  .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    flex: 1;
    padding: 34px 32px 34px 40px;
  }

  #title {
    display: block;
    font-size: 33px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.8px;
    line-clamp: 4;
  }

  #description {
    display: block;
    color: #4b5263;
    font-size: 16px;
    line-height: 1.4;
    line-clamp: 3;
  }

  .site {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 210px;
    padding: 24px;
    background: #eceff4;
  }

  #icon {
    width: 112px;
    height: 112px;
    border-radius: 26px;
    object-fit: cover;
    box-shadow: 0 10px 24px rgba(16, 19, 26, 0.16);
  }

  #host {
    max-width: 170px;
    color: #4b5263;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }
</style>

<body>
  <div class="canvas">
    <div class="text">
      <h1 id="title">Lorem ipsum dolor sit amet consectetur adipisicing elit</h1>
      <p id="description">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
    <div class="site">
      <img id="icon" width="112" height="112" src="https://dummyimage.com/150x150/000/fff" />
      <p id="host">fiimage.vercel.app</p>
    </div>
  </div>
</body>
